name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Create environment
        run: python -m venv .venv
      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt -c requirements.lock.txt
      - name: Run offline tests
        env:
          LLM_PROVIDER: mock
          PYTHONDONTWRITEBYTECODE: "1"
        run: .venv/bin/python -m pytest -o addopts= -q -p no:cacheprovider
